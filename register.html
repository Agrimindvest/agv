<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Agrimindvest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .register-container { max-width: 450px; margin: 0 auto; padding: 30px 20px; }
        .register-title { text-align: center; color: var(--accent-light); margin-bottom: 8px; font-size: 1.5em; }
        .register-subtitle { text-align: center; color: var(--text-dim); margin-bottom: 25px; font-size: 0.9em; }

        .form-group { animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0; }
        .form-group:nth-child(1) { animation-delay: 0.05s; }
        .form-group:nth-child(2) { animation-delay: 0.10s; }
        .form-group:nth-child(3) { animation-delay: 0.15s; }
        .form-group:nth-child(4) { animation-delay: 0.20s; }
        .form-group:nth-child(5) { animation-delay: 0.25s; }
        .form-group:nth-child(6) { animation-delay: 0.30s; }

        @keyframes slideIn { from{opacity:0;transform:translateX(-40px)} to{opacity:1;transform:translateX(0)} }

        .btn-submit { margin-top: 20px; animation: slideIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards; animation-delay: 0.35s; opacity: 0; }
        .ref-hint { font-size: 0.75em; color: var(--text-dim); margin-top: 4px; }

        .bonus-badge {
            display: inline-block; background: rgba(255,193,7,0.2); color: var(--gold);
            padding: 3px 10px; border-radius: 12px; font-size: 0.75em; margin-left: 6px;
            animation: softPulse 2s infinite;
        }
        @keyframes softPulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

        .password-field { position: relative; }
        .password-field .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-dim); transition: all 0.3s; }
        .password-field .toggle-password:hover { color: var(--accent); }
        .form-input:focus { transform: translateY(-2px); }

        /* ✅ NEW: Password match indicator */
        .password-match {
            font-size: 0.75em;
            margin-top: 4px;
            display: none;
        }
        .password-match.show { display: block; }
        .password-match.match { color: var(--success); }
        .password-match.no-match { color: var(--danger); }

        /* ✅ NEW: Error message styling */
        .register-error {
            background: rgba(244,67,54,0.1);
            border: 1px solid var(--danger);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
            color: var(--danger);
            font-size: 0.85em;
            display: none;
            text-align: center;
        }
        .register-error.show { display: block; }
    </style>
</head>
<body>

    <div class="back-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <span style="color:var(--accent-light);font-weight:700;">AGV</span>
    </div>

    <div class="register-container">
        <h2 class="register-title">✨ Create Your Account</h2>
        <p class="register-subtitle">Start earning from agricultural knowledge</p>

        <!-- ✅ NEW: Error display -->
        <div class="register-error" id="registerError"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>👤 Full Name</label>
                <input type="text" class="form-input" id="regName" placeholder="Enter your full name" required autocomplete="name">
            </div>
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" class="form-input" id="regEmail" placeholder="Enter your email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>📱 Phone Number</label>
                <input type="tel" class="form-input" id="regPhone" placeholder="Enter your phone number" required autocomplete="tel">
            </div>
            <div class="form-group">
                <label>🔒 Password</label>
                <div class="password-field">
                    <input type="password" class="form-input" id="regPassword" placeholder="Create a password (min 4 chars)" required minlength="4" autocomplete="new-password">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('regPassword', this)"></i>
                </div>
            </div>
            <!-- ✅ NEW: Confirm Password -->
            <div class="form-group">
                <label>🔐 Confirm Password</label>
                <div class="password-field">
                    <input type="password" class="form-input" id="regConfirmPassword" placeholder="Confirm your password" required minlength="4" autocomplete="new-password" oninput="checkPasswordMatch()">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('regConfirmPassword', this)"></i>
                </div>
                <!-- ✅ NEW: Password match indicator -->
                <div class="password-match" id="passwordMatch"></div>
            </div>
            <div class="form-group">
                <label>🎁 Referral Code <span class="bonus-badge">₦300 Bonus</span></label>
                <input type="text" class="form-input" id="regRefCode" value="ADMIN" placeholder="Enter referral code">
                <p class="ref-hint">💡 Default: ADMIN. Enter a friend's code to help them earn!</p>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-submit" id="registerBtn">✨ CREATE FREE ACCOUNT</button>
        </form>

        <p style="text-align:center;margin-top:20px;color:var(--text-dim);font-size:0.9em;">
            Already registered? <a href="login.html" style="color:var(--accent-light);">Login →</a>
        </p>
        <p style="text-align:center;margin-top:10px;color:var(--text-dim);font-size:0.8em;">
            🔒 Secure Registration • 🎁 ₦300 Welcome Bonus
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase.js"></script>
    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') { 
                input.type = 'text'; 
                icon.classList.replace('fa-eye', 'fa-eye-slash'); 
            } else { 
                input.type = 'password'; 
                icon.classList.replace('fa-eye-slash', 'fa-eye'); 
            }
        }

        // ✅ NEW: Check password match
        function checkPasswordMatch() {
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            const matchEl = document.getElementById('passwordMatch');
            
            if (confirm.length === 0) {
                matchEl.classList.remove('show', 'match', 'no-match');
                return;
            }
            
            matchEl.classList.add('show');
            if (password === confirm) {
                matchEl.textContent = '✅ Passwords match!';
                matchEl.className = 'password-match show match';
            } else {
                matchEl.textContent = '❌ Passwords do not match';
                matchEl.className = 'password-match show no-match';
            }
        }

        // ✅ NEW: Show error message
        function showError(message) {
            const errorEl = document.getElementById('registerError');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => {
                errorEl.classList.remove('show');
            }, 5000);
        }

        window.addEventListener('load', () => {
            // Check URL for referral code
            const urlParams = new URLSearchParams(window.location.search);
            let refCode = urlParams.get('ref');
            if (refCode) {
                document.getElementById('regRefCode').value = refCode;
                toast('🎁 Referral code applied: ' + refCode);
            }
            // Check if already logged in
            const savedUser = localStorage.getItem('agv_u');
            if (savedUser) {
                try { 
                    const u = JSON.parse(savedUser); 
                    if (u && u.id) window.location.href = 'home.html'; 
                } catch(e) {}
            }
        });

        async function handleRegister(event) {
            event.preventDefault();
            
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            let refCode = document.getElementById('regRefCode').value.trim();

            // ✅ FIXED: Validate all fields
            if (!name || !email || !phone || !password || !confirmPassword) {
                showError('Please fill all required fields');
                return;
            }
            
            if (password.length < 4) {
                showError('Password must be at least 4 characters');
                return;
            }
            
            // ✅ NEW: Check if passwords match
            if (password !== confirmPassword) {
                showError('❌ Passwords do not match. Please try again.');
                return;
            }
            
            if (!refCode) refCode = 'ADMIN';

            const btn = document.getElementById('registerBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ Creating Account...';

            try {
                // Check duplicate email
                const emailCheck = await db.collection('users').where('email', '==', email).get();
                if (!emailCheck.empty) {
                    btn.disabled = false; 
                    btn.textContent = originalText;
                    showError('⚠️ Email already registered. Please login.');
                    return;
                }

                // Generate AGV ID
                const userId = generateUserId();

                // Check referral code
                let referredBy = 'ADMIN';
                if (refCode && refCode !== 'ADMIN') {
                    const refCheck = await db.collection('users').where('refCode', '==', refCode).get();
                    if (!refCheck.empty) referredBy = refCheck.docs[0].id;
                }

                // Create user with ₦300 welcome bonus
                const newUser = {
                    id: userId, 
                    name, 
                    email, 
                    phone, 
                    password,
                    balance: WELCOME_BONUS, 
                    totalEarned: WELCOME_BONUS, 
                    tasksCompleted: 0,
                    plan: 'none', 
                    status: 'active', 
                    refCode: userId, 
                    referredBy,
                    refEarnings: 0, 
                    refCount: 0, 
                    ownedPlans: [], 
                    invested: false,
                    investmentAmount: 0, 
                    createdAt: new Date().toISOString()
                };

                await db.collection('users').doc(userId).set(newUser);

                // Record referral
                await db.collection('referrals').add({
                    referrerId: referredBy, 
                    refereeId: userId, 
                    refereeName: name,
                    date: new Date().toISOString(), 
                    level: 1, 
                    earned: 0, 
                    status: 'pending'
                });

                // Update referrer count
                if (referredBy !== 'ADMIN') {
                    const refDoc = await db.collection('users').doc(referredBy).get();
                    if (refDoc.exists) {
                        await db.collection('users').doc(referredBy).update({
                            refCount: (refDoc.data().refCount || 0) + 1
                        });
                    }
                }

                // Welcome bonus deposit record
                await db.collection('deposits').add({
                    userId, 
                    userName: name, 
                    amount: WELCOME_BONUS, 
                    channel: 'bonus',
                    date: new Date().toISOString(), 
                    status: 'approved', 
                    ref: 'WELCOME-BONUS',
                    note: 'Welcome bonus on registration'
                });

                // Save to localStorage
                localStorage.setItem('agv_u', JSON.stringify(newUser));

                toast('🎉 Account created! ₦' + WELCOME_BONUS + ' welcome bonus added!');
                btn.disabled = false;
                btn.textContent = originalText;
                
                setTimeout(() => { 
                    window.location.href = 'home.html'; 
                }, 1000);

            } catch (error) {
                console.error('Registration error:', error);
                btn.disabled = false; 
                btn.textContent = originalText;
                
                // ✅ FIXED: Better error messages
                if (error.code === 'permission-denied') {
                    showError('❌ Permission denied. Please check your Firestore rules.');
                } else if (error.code === 'unavailable') {
                    showError('❌ Service unavailable. Please check your connection.');
                } else {
                    showError('❌ Registration failed: ' + (error.message || 'Please try again.'));
                }
            }
        }

        // ✅ NEW: Auto-check password match on both fields
        document.getElementById('regPassword').addEventListener('input', checkPasswordMatch);
        document.getElementById('regConfirmPassword').addEventListener('input', checkPasswordMatch);
    </script>
</body>
</html>
